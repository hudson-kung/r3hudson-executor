<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>R3Hudson Executor v3.0.1</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --primary-color: #6366f1;
            --secondary-color: #8b5cf6;
            --accent-color: #ec4899;
            --dark-bg: #0f172a;
            --darker-bg: #020617;
            --light-bg: #1e293b;
            --text-primary: #f1f5f9;
            --text-secondary: #94a3b8;
            --border-color: #334155;
            --success-color: #10b981;
            --warning-color: #f59e0b;
            --error-color: #ef4444;
        }

        body {
            margin: 0;
            padding: 0;
            background: linear-gradient(135deg, #0f172a 0%, #020617 100%);
            font-family: 'Inter', sans-serif;
            overflow: hidden;
        }
        
        .executor-window {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: var(--light-bg);
            border-radius: 0;
            box-shadow: none;
            border: none;
            animation: none;
        }
        
        .executor-window.minimized {
            height: 60px;
        }
        
        .executor-window.maximized {
            top: 0;
            left: 0;
            transform: none;
            width: 100vw;
            height: 100vh;
            border-radius: 0;
        }

        .executor-header {
            background: linear-gradient(135deg, var(--primary-color), var(--secondary-color));
            padding: 1rem 1.5rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            color: white;
        }

        .executor-title {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            font-weight: 600;
            font-size: 1.1rem;
        }

        .executor-controls {
            display: flex;
            gap: 0.5rem;
        }

        .executor-controls button {
            width: 24px;
            height: 24px;
            border: none;
            border-radius: 4px;
            background: rgba(255, 255, 255, 0.2);
            color: white;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s ease;
            font-size: 0.7rem;
        }

        .executor-controls button:hover {
            background: rgba(255, 255, 255, 0.3);
            transform: scale(1.1);
        }

        .executor-close:hover {
            background: #ff4444;
        }

        .executor-body {
            display: flex;
            height: calc(100% - 60px);
        }

        .executor-sidebar {
            width: 180px;
            background: var(--dark-bg);
            border-right: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
        }

        .executor-tabs {
            display: flex;
            border-bottom: 1px solid var(--border-color);
        }

        .tab-btn {
            flex: 1;
            padding: 0.5rem;
            background: none;
            border: none;
            color: var(--text-secondary);
            cursor: pointer;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 0.25rem;
            font-size: 0.7rem;
            transition: all 0.3s ease;
        }

        .tab-btn:hover {
            background: var(--light-bg);
            color: var(--text-primary);
        }

        .tab-btn.active {
            background: var(--primary-color);
            color: white;
        }

        .tab-btn i {
            font-size: 1rem;
        }

        .script-list {
            flex: 1;
            overflow-y: auto;
            padding: 1rem 0;
        }

        .script-item {
            padding: 0.5rem 1rem;
            color: var(--text-secondary);
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 0.5rem;
            transition: all 0.2s ease;
            font-size: 0.8rem;
        }

        .script-item:hover {
            background: var(--light-bg);
            color: var(--primary-color);
            border-left: 3px solid var(--primary-color);
        }

        .script-item i {
            width: 12px;
            text-align: center;
        }

        .executor-main {
            flex: 1;
            display: flex;
            flex-direction: column;
            background: var(--darker-bg);
        }

        .script-editor {
            flex: 1;
            display: flex;
            flex-direction: column;
            border-bottom: 1px solid var(--border-color);
        }

        .editor-header {
            background: var(--light-bg);
            padding: 0.75rem 1rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--border-color);
        }

        .editor-title {
            color: var(--text-primary);
            font-weight: 500;
            font-size: 0.9rem;
        }

        .editor-actions {
            display: flex;
            gap: 0.5rem;
        }

        .editor-btn {
            padding: 0.4rem 0.8rem;
            background: var(--dark-bg);
            border: 1px solid var(--border-color);
            color: var(--text-secondary);
            border-radius: 4px;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 0.5rem;
            font-size: 0.7rem;
            transition: all 0.2s ease;
        }

        .editor-btn:hover {
            background: var(--primary-color);
            color: white;
            border-color: var(--primary-color);
        }

        .script-textarea {
            flex: 1;
            background: var(--dark-bg);
            color: var(--text-primary);
            border: none;
            padding: 1rem;
            font-family: 'Courier New', monospace;
            font-size: 0.9rem;
            resize: none;
            outline: none;
            line-height: 1.5;
        }

        .script-textarea::placeholder {
            color: var(--text-secondary);
            opacity: 0.6;
        }

        .executor-controls-panel {
            background: var(--light-bg);
            padding: 1rem;
            border-bottom: 1px solid var(--border-color);
        }

        .control-buttons {
            display: flex;
            gap: 0.5rem;
            margin-bottom: 1rem;
        }

        .execute-btn, .inject-btn, .clear-btn {
            padding: 0.5rem 1rem;
            border: none;
            border-radius: 6px;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 0.5rem;
            transition: all 0.3s ease;
            font-size: 0.8rem;
        }

        .execute-btn {
            background: linear-gradient(135deg, var(--success-color), #059669);
            color: white;
        }

        .execute-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(16, 185, 129, 0.3);
        }

        .inject-btn {
            background: linear-gradient(135deg, var(--warning-color), #d97706);
            color: white;
        }

        .inject-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(245, 158, 11, 0.3);
        }

        .clear-btn {
            background: var(--dark-bg);
            color: var(--text-secondary);
            border: 1px solid var(--border-color);
        }

        .clear-btn:hover {
            background: var(--error-color);
            color: white;
            border-color: var(--error-color);
        }

        .status-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.8rem;
        }

        .status-indicator {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            color: var(--text-secondary);
        }

        .status-indicator.ready {
            color: var(--success-color);
        }

        .status-indicator.ready i {
            font-size: 0.6rem;
        }

        .injection-status {
            color: var(--text-secondary);
        }

        .output-console {
            height: 150px;
            background: var(--dark-bg);
            display: flex;
            flex-direction: column;
        }

        .console-header {
            background: var(--light-bg);
            padding: 0.75rem 1rem;
            color: var(--text-primary);
            font-weight: 500;
            font-size: 0.9rem;
            border-bottom: 1px solid var(--border-color);
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .console-output {
            flex: 1;
            overflow-y: auto;
            padding: 1rem;
            font-family: 'Courier New', monospace;
            font-size: 0.8rem;
        }

        .console-line {
            margin-bottom: 0.5rem;
            display: flex;
            align-items: flex-start;
            gap: 0.75rem;
        }

        .console-timestamp {
            color: var(--text-secondary);
            opacity: 0.7;
            white-space: nowrap;
        }

        .console-info {
            color: var(--text-primary);
        }

        .console-success {
            color: var(--success-color);
        }

        .console-error {
            color: var(--error-color);
        }

        .console-warning {
            color: var(--warning-color);
        }
    </style>
</head>
<body>
    <div class="executor-window">
        <div class="executor-header">
            <div class="executor-title">
                <i class="fas fa-terminal"></i>
                <span>R3Hudson Executor v3.0.1</span>
            </div>
            <div class="executor-controls">
                <button class="executor-minimize" onclick="minimizeExecutor()">
                    <i class="fas fa-minus"></i>
                </button>
                <button class="executor-maximize" onclick="maximizeExecutor()">
                    <i class="fas fa-square"></i>
                </button>
                <button class="executor-close" onclick="window.close()">
                    <i class="fas fa-times"></i>
                </button>
            </div>
        </div>
        <div class="executor-body">
            <div class="executor-sidebar">
                <div class="executor-tabs">
                    <button class="tab-btn active" onclick="switchTab('scripts')">
                        <i class="fas fa-code"></i> Scripts
                    </button>
                    <button class="tab-btn" onclick="switchTab('settings')">
                        <i class="fas fa-cog"></i> Settings
                    </button>
                    <button class="tab-btn" onclick="switchTab('about')">
                        <i class="fas fa-info"></i> About
                    </button>
                </div>
                <div class="script-list">
                    <div class="script-item" onclick="loadScript('fe_kill_all')">
                        <i class="fas fa-user-slash"></i> FE Kill All
                    </div>
                    <div class="script-item" onclick="loadScript('fly')">
                        <i class="fas fa-plane"></i> Fly
                    </div>
                    <div class="script-item" onclick="loadScript('esp')">
                        <i class="fas fa-eye"></i> ESP
                    </div>
                    <div class="script-item" onclick="loadScript('speed')">
                        <i class="fas fa-tachometer-alt"></i> Speed
                    </div>
                    <div class="script-item" onclick="loadScript('teleport')">
                        <i class="fas fa-map-marker-alt"></i> Teleport
                    </div>
                </div>
            </div>
            <div class="executor-main">
                <div class="script-editor">
                    <div class="editor-header">
                        <span class="editor-title">Script Editor</span>
                        <div class="editor-actions">
                            <button class="editor-btn" onclick="clearScript()">
                                <i class="fas fa-trash"></i> Clear
                            </button>
                            <button class="editor-btn" onclick="saveScript()">
                                <i class="fas fa-save"></i> Save
                            </button>
                        </div>
                    </div>
                    <textarea id="scriptInput" class="script-textarea" placeholder="-- Enter your Lua script here...&#10;&#10;Example:&#10;game.Players.LocalPlayer.Character.Humanoid.Health = 100"></textarea>
                </div>
                <div class="executor-controls-panel">
                    <div class="control-buttons">
                        <button class="execute-btn" onclick="executeScript()">
                            <i class="fas fa-play"></i> Execute
                        </button>
                        <button class="inject-btn" onclick="injectScript()">
                            <i class="fas fa-syringe"></i> Inject
                        </button>
                        <button class="clear-btn" onclick="clearOutput()">
                            <i class="fas fa-broom"></i> Clear Output
                        </button>
                    </div>
                    <div class="status-bar">
                        <span class="status-indicator ready">
                            <i class="fas fa-circle"></i> Ready
                        </span>
                        <span class="injection-status">Not Injected</span>
                    </div>
                </div>
                <div class="output-console">
                    <div class="console-header">
                        <i class="fas fa-terminal"></i> Output Console
                    </div>
                    <div id="outputConsole" class="console-output">
                        <div class="console-line">
                            <span class="console-timestamp">[3:40:00 PM]</span>
                            <span class="console-info">R3Hudson Executor initialized</span>
                        </div>
                        <div class="console-line">
                            <span class="console-timestamp">[3:40:00 PM]</span>
                            <span class="console-info">Waiting for Roblox process...</span>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        // Predefined scripts
        const scripts = {
            fe_kill_all: `-- FE Kill All Script
local Players = game:GetService("Players")
for _, player in pairs(Players:GetPlayers()) do
    if player ~= Players.LocalPlayer then
        local character = player.Character
        if character and character:FindFirstChild("Humanoid") then
            character.Humanoid.Health = 0
        end
    end
end
print("FE Kill All executed!")`,
            
            fly: `-- Fly Script
local player = game.Players.LocalPlayer
local mouse = player:GetMouse()
local character = player.Character or player.CharacterAdded:Wait()

local flySpeed = 50
local flying = false
local flyPart = Instance.new("Part")
flyPart.Name = "FlyPart"
flyPart.Anchored = true
flyPart.CanCollide = false
flyPart.Size = Vector3.new(1, 1, 1)
flyPart.Parent = workspace

mouse.KeyDown:Connect(function(key)
    if key == "f" then
        flying = not flying
        if flying then
            print("Fly enabled!")
        else
            print("Fly disabled!")
        end
    end
end)

game:GetService("RunService").Heartbeat:Connect(function()
    if flying then
        local cam = workspace.CurrentCamera
        flyPart.Position = character.Head.Position
        character.Humanoid:ChangeState("Freefall")
        character:MoveTo(cam.CFrame.Position + cam.CFrame.LookVector * flySpeed * 0.1)
    end
end)`,
            
            esp: `-- ESP Script
local players = game:GetService("Players")
local localPlayer = players.LocalPlayer

local function createESP(player)
    local character = player.Character
    if not character then return end
    
    local highlight = Instance.new("Highlight")
    highlight.FillColor = Color3.new(1, 0, 0)
    highlight.FillTransparency = 0.5
    highlight.OutlineColor = Color3.new(1, 1, 1)
    highlight.Adornee = character
    highlight.Parent = character
    
    local nameTag = Instance.new("BillboardGui")
    nameTag.Name = "ESP_Name"
    nameTag.Size = UDim2.new(0, 100, 0, 50)
    nameTag.StudsOffset = Vector3.new(0, 3, 0)
    nameTag.Parent = character.Head
    
    local nameLabel = Instance.new("TextLabel")
    nameLabel.Size = UDim2.new(1, 0, 1, 0)
    nameLabel.BackgroundTransparency = 1
    nameLabel.Text = player.Name
    nameLabel.TextColor3 = Color3.new(1, 1, 1)
    nameLabel.TextStrokeTransparency = 0
    nameLabel.Font = Enum.Font.SourceSansBold
    nameLabel.TextSize = 14
    nameLabel.Parent = nameTag
end

for _, player in pairs(players:GetPlayers()) do
    if player ~= localPlayer then
        createESP(player)
    end
end

players.PlayerAdded:Connect(function(player)
    if player ~= localPlayer then
        createESP(player)
    end
end)

print("ESP enabled!")`,
            
            speed: `-- Speed Script
local player = game.Players.LocalPlayer
local character = player.Character or player.CharacterAdded:Wait()
local humanoid = character:WaitForChild("Humanoid")

humanoid.WalkSpeed = 50
humanoid.JumpPower = 100

print("Speed boost enabled!")`,
            
            teleport: `-- Teleport Script
local player = game.Players.LocalPlayer
local mouse = player:GetMouse()
local character = player.Character or player.CharacterAdded:Wait()

mouse.KeyDown:Connect(function(key)
    if key == "t" then
        local targetPos = mouse.Hit.Position
        character:MoveTo(targetPos)
        print("Teleported to cursor position!")
    end
end)

print("Teleport script loaded! Press T to teleport to cursor position.")`
        };

        function switchTab(tab) {
            // Remove active class from all tabs
            document.querySelectorAll('.tab-btn').forEach(btn => {
                btn.classList.remove('active');
            });
            
            // Add active class to clicked tab
            event.target.classList.add('active');
            
            addConsoleMessage(`Switched to ${tab} tab`, 'info');
        }

        function loadScript(scriptName) {
            const scriptInput = document.getElementById('scriptInput');
            if (scripts[scriptName]) {
                scriptInput.value = scripts[scriptName];
                addConsoleMessage(`Loaded script: ${scriptName}`, 'success');
            } else {
                addConsoleMessage(`Script not found: ${scriptName}`, 'error');
            }
        }

        function executeScript() {
            const scriptInput = document.getElementById('scriptInput');
            const script = scriptInput.value.trim();
            
            if (!script) {
                addConsoleMessage('No script to execute!', 'error');
                return;
            }
            
            // Simulate script execution
            addConsoleMessage('Executing script...', 'info');
            
            setTimeout(() => {
                addConsoleMessage('Script executed successfully!', 'success');
                
                // Parse and execute actual JavaScript commands
                try {
                    // Handle print statements properly
                    const printRegex = /print\("([^"]+)"\)/g;
                    let match;
                    while ((match = printRegex.exec(script)) !== null) {
                        const message = match[1];
                        addConsoleMessage(`[OUTPUT] ${message}`, 'info');
                    }
                    
                    // Simulate different script types with actual effects
                    if (script.includes('Kill All')) {
                        simulateKillAll();
                    } else if (script.includes('Fly')) {
                        simulateFly();
                    } else if (script.includes('ESP')) {
                        simulateESP();
                    } else if (script.includes('Speed')) {
                        simulateSpeed();
                    } else if (script.includes('Teleport')) {
                        simulateTeleport();
                    } else {
                        // For custom scripts, just show success
                        addConsoleMessage('Custom script executed!', 'success');
                    }
                    
                } catch (error) {
                    addConsoleMessage(`Script error: ${error.message}`, 'error');
                }
            }, 1000);
        }

        // Simulated Roblox environment
        window.robloxGame = {
            GetService: function(service) {
                return {
                    Players: window.robloxPlayers,
                    Workspace: window.robloxWorkspace,
                    RunService: {
                        Heartbeat: function(callback) {
                            setInterval(callback, 16);
                        }
                    }
                }[service] || {};
            }
        };

        window.robloxPlayers = {
            LocalPlayer: {
                Character: {
                    Humanoid: {
                        Health: 100,
                        WalkSpeed: 16,
                        JumpPower: 50
                    }
                }
            },
            GetPlayers: function() {
                return [
                    { Name: 'Player1', Character: { Humanoid: { Health: 100 } } },
                    { Name: 'Player2', Character: { Humanoid: { Health: 100 } } }
                ];
            }
        };

        window.robloxWorkspace = {
            CurrentCamera: {
                CFrame: { Position: { x: 0, y: 0, z: 0 }, LookVector: { x: 0, y: 0, z: 1 } }
            }
        };

        // Functional script simulations
        function simulateFly() {
            addConsoleMessage('Activating flight mode...', 'info');
            window.isFlying = false;
            window.flySpeed = 50;
            
            // Create visual flying indicator
            const flyIndicator = document.createElement('div');
            flyIndicator.id = 'flyIndicator';
            flyIndicator.style.cssText = `
                position: fixed;
                top: 20px;
                right: 20px;
                background: linear-gradient(135deg, var(--success-color), #059669);
                color: white;
                padding: 10px 15px;
                border-radius: 8px;
                font-weight: 600;
                z-index: 10000;
                box-shadow: 0 4px 12px rgba(16, 185, 129, 0.3);
                transition: all 0.3s ease;
            `;
            flyIndicator.innerHTML = '<i class="fas fa-plane"></i> Flight: OFF';
            document.body.appendChild(flyIndicator);
            
            document.addEventListener('keydown', function flyHandler(e) {
                if (e.key === 'f' || e.key === 'F') {
                    window.isFlying = !window.isFlying;
                    const indicator = document.getElementById('flyIndicator');
                    if (window.isFlying) {
                        indicator.innerHTML = '<i class="fas fa-plane"></i> Flight: ON';
                        indicator.style.background = 'linear-gradient(135deg, var(--success-color), #059669)';
                        addConsoleMessage('Fly enabled! Press F to toggle.', 'success');
                        startFlyingEffect();
                    } else {
                        indicator.innerHTML = '<i class="fas fa-plane"></i> Flight: OFF';
                        indicator.style.background = 'linear-gradient(135deg, var(--text-secondary), #666)';
                        addConsoleMessage('Fly disabled!', 'warning');
                        stopFlyingEffect();
                    }
                }
            });
        }

        function startFlyingEffect() {
            const executorWindow = document.querySelector('.executor-window');
            executorWindow.style.animation = 'float 3s ease-in-out infinite';
            
            // Add floating animation
            const style = document.createElement('style');
            style.textContent = `
                @keyframes float {
                    0%, 100% { transform: translateY(0px); }
                    50% { transform: translateY(-10px); }
                }
            `;
            document.head.appendChild(style);
        }

        function stopFlyingEffect() {
            const executorWindow = document.querySelector('.executor-window');
            executorWindow.style.animation = '';
        }

        function simulateESP() {
            addConsoleMessage('Enabling ESP...', 'info');
            addConsoleMessage('ESP enabled for all players!', 'success');
            
            // Create ESP overlay
            const espOverlay = document.createElement('div');
            espOverlay.id = 'espOverlay';
            espOverlay.style.cssText = `
                position: fixed;
                top: 0;
                left: 0;
                width: 100%;
                height: 100%;
                pointer-events: none;
                z-index: 9999;
            `;
            
            // Add simulated player boxes
            const players = [
                { name: 'Player1', x: 20, y: 20, health: 100 },
                { name: 'Player2', x: 80, y: 30, health: 75 },
                { name: 'Player3', x: 50, y: 60, health: 50 }
            ];
            
            players.forEach(player => {
                const playerBox = document.createElement('div');
                playerBox.style.cssText = `
                    position: absolute;
                    left: ${player.x}%;
                    top: ${player.y}%;
                    background: rgba(255, 0, 0, 0.3);
                    border: 2px solid #ff0000;
                    border-radius: 8px;
                    padding: 5px;
                    color: white;
                    font-weight: 600;
                    font-size: 12px;
                `;
                playerBox.innerHTML = `${player.name}<br>HP: ${player.health}`;
                espOverlay.appendChild(playerBox);
                
                addConsoleMessage(`${player.name}: [VISIBLE] Health: ${player.health}`, 'info');
            });
            
            document.body.appendChild(espOverlay);
            
            // Add ESP indicator
            const espIndicator = document.createElement('div');
            espIndicator.id = 'espIndicator';
            espIndicator.style.cssText = `
                position: fixed;
                top: 20px;
                right: 20px;
                background: linear-gradient(135deg, #ff0000, #cc0000);
                color: white;
                padding: 10px 15px;
                border-radius: 8px;
                font-weight: 600;
                z-index: 10000;
                box-shadow: 0 4px 12px rgba(255, 0, 0, 0.3);
            `;
            espIndicator.innerHTML = '<i class="fas fa-eye"></i> ESP: ON';
            document.body.appendChild(espIndicator);
        }

        function simulateSpeed() {
            addConsoleMessage('Applying speed boost...', 'info');
            
            // Create speed boost effect
            const speedEffect = document.createElement('div');
            speedEffect.id = 'speedEffect';
            speedEffect.style.cssText = `
                position: fixed;
                top: 0;
                left: 0;
                width: 100%;
                height: 100%;
                background: linear-gradient(45deg, transparent, rgba(255, 255, 0, 0.1), transparent);
                pointer-events: none;
                z-index: 9998;
                animation: speedPulse 1s ease-in-out infinite;
            `;
            
            // Add speed animation
            const style = document.createElement('style');
            style.textContent = `
                @keyframes speedPulse {
                    0%, 100% { opacity: 0.3; }
                    50% { opacity: 0.8; }
                }
            `;
            document.head.appendChild(style);
            document.body.appendChild(speedEffect);
            
            setTimeout(() => {
                addConsoleMessage('Speed boost activated!', 'success');
                addConsoleMessage('WalkSpeed: 50, JumpPower: 100', 'info');
                
                // Add speed indicator
                const speedIndicator = document.createElement('div');
                speedIndicator.id = 'speedIndicator';
                speedIndicator.style.cssText = `
                    position: fixed;
                    top: 20px;
                    right: 20px;
                    background: linear-gradient(135deg, #ffff00, #cccc00);
                    color: black;
                    padding: 10px 15px;
                    border-radius: 8px;
                    font-weight: 600;
                    z-index: 10000;
                    box-shadow: 0 4px 12px rgba(255, 255, 0, 0.3);
                `;
                speedIndicator.innerHTML = '<i class="fas fa-tachometer-alt"></i> SPEED: ON';
                document.body.appendChild(speedIndicator);
                
                // Remove speed effect after 5 seconds
                setTimeout(() => {
                    if (document.getElementById('speedEffect')) {
                        document.getElementById('speedEffect').remove();
                    }
                }, 5000);
            }, 1000);
        }

        function simulateTeleport() {
            addConsoleMessage('Loading teleport script...', 'info');
            addConsoleMessage('Teleport script loaded! Press T to teleport to cursor position.', 'success');
            
            // Create teleport indicator
            const teleportIndicator = document.createElement('div');
            teleportIndicator.id = 'teleportIndicator';
            teleportIndicator.style.cssText = `
                position: fixed;
                top: 20px;
                right: 20px;
                background: linear-gradient(135deg, #9333ea, #7c3aed);
                color: white;
                padding: 10px 15px;
                border-radius: 8px;
                font-weight: 600;
                z-index: 10000;
                box-shadow: 0 4px 12px rgba(147, 51, 234, 0.3);
            `;
            teleportIndicator.innerHTML = '<i class="fas fa-map-marker-alt"></i> TELEPORT: READY';
            document.body.appendChild(teleportIndicator);
            
            document.addEventListener('keydown', function teleportHandler(e) {
                if (e.key === 't' || e.key === 'T') {
                    // Create teleport effect
                    const teleportEffect = document.createElement('div');
                    teleportEffect.style.cssText = `
                        position: fixed;
                        top: 50%;
                        left: 50%;
                        width: 100px;
                        height: 100px;
                        background: radial-gradient(circle, rgba(147, 51, 234, 0.8), transparent);
                        border-radius: 50%;
                        transform: translate(-50%, -50%);
                        z-index: 10001;
                        animation: teleportBurst 0.5s ease-out;
                    `;
                    
                    const style = document.createElement('style');
                    style.textContent = `
                        @keyframes teleportBurst {
                            0% { transform: translate(-50%, -50%) scale(0); opacity: 1; }
                            100% { transform: translate(-50%, -50%) scale(3); opacity: 0; }
                        }
                    `;
                    document.head.appendChild(style);
                    document.body.appendChild(teleportEffect);
                    
                    addConsoleMessage('Teleported to cursor position!', 'success');
                    
                    // Remove effect after animation
                    setTimeout(() => {
                        teleportEffect.remove();
                    }, 500);
                }
            });
        }

        function simulateKillAll() {
            addConsoleMessage('Eliminating all players...', 'warning');
            
            // Create elimination effect
            const killEffect = document.createElement('div');
            killEffect.style.cssText = `
                position: fixed;
                top: 0;
                left: 0;
                width: 100%;
                height: 100%;
                background: radial-gradient(circle, rgba(255, 0, 0, 0.3), transparent);
                pointer-events: none;
                z-index: 9997;
                animation: killPulse 2s ease-out;
            `;
            
            const style = document.createElement('style');
            style.textContent = `
                @keyframes killPulse {
                    0% { opacity: 0; }
                    50% { opacity: 1; }
                    100% { opacity: 0; }
                }
            `;
            document.head.appendChild(style);
            document.body.appendChild(killEffect);
            
            setTimeout(() => {
                addConsoleMessage('All players eliminated!', 'success');
                addConsoleMessage('Killed: Player1, Player2, Player3', 'info');
                
                // Add kill indicator
                const killIndicator = document.createElement('div');
                killIndicator.id = 'killIndicator';
                killIndicator.style.cssText = `
                    position: fixed;
                    top: 20px;
                    right: 20px;
                    background: linear-gradient(135deg, #ff0000, #cc0000);
                    color: white;
                    padding: 10px 15px;
                    border-radius: 8px;
                    font-weight: 600;
                    z-index: 10000;
                    box-shadow: 0 4px 12px rgba(255, 0, 0, 0.3);
                `;
                killIndicator.innerHTML = '<i class="fas fa-skull"></i> KILL ALL: ACTIVATED';
                document.body.appendChild(killIndicator);
                
                // Remove effects after 3 seconds
                setTimeout(() => {
                    if (document.getElementById('killEffect')) {
                        document.getElementById('killEffect').remove();
                    }
                }, 3000);
            }, 1500);
        }

        function injectScript() {
            addConsoleMessage('Injecting into Roblox process...', 'warning');
            
            setTimeout(() => {
                addConsoleMessage('Roblox process found', 'success');
                addConsoleMessage('Injecting DLL...', 'info');
                
                setTimeout(() => {
                    addConsoleMessage('Injection successful!', 'success');
                    document.querySelector('.injection-status').textContent = 'Injected';
                    document.querySelector('.injection-status').style.color = 'var(--success-color)';
                }, 1500);
            }, 1000);
        }

        function clearScript() {
            const scriptInput = document.getElementById('scriptInput');
            scriptInput.value = '';
            addConsoleMessage('Script editor cleared', 'info');
            
            // Clear all active effects
            clearAllEffects();
        }

        function clearAllEffects() {
            // Remove all indicators and effects
            const effects = ['flyIndicator', 'espIndicator', 'speedIndicator', 'teleportIndicator', 'killIndicator', 'espOverlay', 'speedEffect', 'killEffect'];
            effects.forEach(id => {
                const element = document.getElementById(id);
                if (element) element.remove();
            });
        }

        function saveScript() {
            const scriptInput = document.getElementById('scriptInput');
            const script = scriptInput.value.trim();
            
            if (!script) {
                addConsoleMessage('No script to save!', 'error');
                return;
            }
            
            // Simulate saving to local storage
            const scriptName = prompt('Enter script name:');
            if (scriptName) {
                localStorage.setItem(`script_${scriptName}`, script);
                addConsoleMessage(`Script "${scriptName}" saved successfully`, 'success');
            }
        }

        function clearOutput() {
            const outputConsole = document.getElementById('outputConsole');
            outputConsole.innerHTML = `
                <div class="console-line">
                    <span class="console-timestamp">[${getCurrentTime()}]</span>
                    <span class="console-info">Console cleared</span>
                </div>
            `;
        }

        function addConsoleMessage(message, type = 'info') {
            const outputConsole = document.getElementById('outputConsole');
            const timestamp = getCurrentTime();
            
            const messageClass = type === 'error' ? 'console-error' : 
                                type === 'success' ? 'console-success' : 
                                type === 'warning' ? 'console-warning' : 'console-info';
            
            const messageLine = document.createElement('div');
            messageLine.className = 'console-line';
            messageLine.innerHTML = `
                <span class="console-timestamp">[${timestamp}]</span>
                <span class="${messageClass}">${message}</span>
            `;
            
            outputConsole.appendChild(messageLine);
            outputConsole.scrollTop = outputConsole.scrollHeight;
        }

        function getCurrentTime() {
            const now = new Date();
            return now.toLocaleTimeString('en-US', { 
                hour12: false, 
                hour: '2-digit', 
                minute: '2-digit', 
                second: '2-digit' 
            });
        }

        function minimizeExecutor() {
            const window = document.querySelector('.executor-window');
            window.classList.toggle('minimized');
        }

        function maximizeExecutor() {
            const window = document.querySelector('.executor-window');
            window.classList.toggle('maximized');
        }

        // Keyboard shortcuts
        document.addEventListener('keydown', (e) => {
            // Ctrl+Enter to execute
            if (e.ctrlKey && e.key === 'Enter') {
                executeScript();
            }
            // Escape to close
            else if (e.key === 'Escape') {
                window.close();
            }
        });

        // Initialize
        window.addEventListener('load', () => {
            addConsoleMessage('R3Hudson Executor v3.0.1 loaded', 'success');
        });
    </script>
</body>
</html>
